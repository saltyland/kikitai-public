name: CI

# PR作成時と main への push 時に、型チェック・lint・テスト・ビルドを自動実行する。
# これにより、壊れたコードがマージ／デプロイされるのを防ぐ。
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走行中の古いジョブを打ち切る。
# Actions の実行時間を無駄にせず、最新コミットの結果だけを見る。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定の権限を読み取りのみに絞る（最小権限）。
permissions:
  contents: read

jobs:
  verify:
    name: 型チェック・Lint・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

      # ビルドには Supabase の公開環境変数が必要（値はダミーでよい：接続せず静的検証のみ）
      - name: ビルド
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
